<!doctype html>
<html lang="en">
  <body>
    <!-- Static copy of the enquiry form so Netlify Forms can detect it at deploy time. -->
    <form name="enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="phone" />
      <input name="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
